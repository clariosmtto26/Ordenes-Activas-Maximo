  <title>ORDENES ACTIVAS MAXIMO</title>
  <style>
    /* Asegura que el contenedor ocupe exactamente el 100% de la pantalla */

      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc; /* Color de fondo a juego con la app (slate-50) */
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
